
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Schedule</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      margin: 0;
      padding: 25px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px #0001;
    }

    h1 {
      text-align: center;
      color: #b22222;
    }

    p {
      text-align: center;
      color: #555;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      color: white;
      background: #b22222;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.85;
    }

    .save {
      background: #237a45;
    }

    .print {
      background: #344563;
    }

    .delete {
      background: #777;
      padding: 7px 10px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th {
      background: #b22222;
      color: white;
      padding: 15px;
      text-align: left;
    }

    td {
      border: 1px solid #ddd;
      padding: 12px;
    }

    tbody tr:nth-child(even) {
      background: #f7f7f7;
    }

    td[contenteditable="true"]:focus {
      outline: 2px solid #b22222;
      background: #fff4f4;
    }

    .status {
      margin-top: 15px;
      text-align: left;
      color: #237a45;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
      }

      .buttons, .actions, .status, p {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Activity Schedule</h1>
    <p>Daily Program Agenda</p>

    <div class="buttons">
      <button onclick="addRow()">+ Add Activity</button>
      <button class="save" onclick="saveSchedule()">
        Save Changes
      </button>
      <button class="print" onclick="window.print()">
        Print Schedule
      </button>
    </div>

    <div class="table-wrap">
      <table id="schedule">
        <thead>
          <tr>
            <th>Time</th>
            <th>Activity</th>
            <th>Description</th>
            <th class="actions">Action</th>
          </tr>
        </thead>

        <tbody id="scheduleBody">
          <tr>
            <td contenteditable="true">9:00–10:00 AM</td>
            <td contenteditable="true">Check-in</td>
            <td contenteditable="true">
              Welcome participants and take attendance.
            </td>
            <td class="actions">
              <button class="delete" onclick="deleteRow(this)">
                Delete
              </button>
            </td>
          </tr>

          <tr>
            <td contenteditable="true">10:00–11:00 AM</td>
            <td contenteditable="true">Music</td>
            <td contenteditable="true">
              Music, listening activities, and group participation.
            </td>
            <td class="actions">
              <button class="delete" onclick="deleteRow(this)">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="buttons">
      <button class="save" onclick="saveSchedule()">
        Save Schedule
      </button>
      <button class="print" onclick="window.print()">
        Print / PDF
      </button>
    </div>

    <div class="status" id="status">
      Edit any cell, then click Save Changes.
    </div>
  </div>

  <script>
    const body = document.getElementById("scheduleBody");
    const status = document.getElementById("status");

    function addRow() {
      const row = body.insertRow();

      for (let i = 0; i < 3; i++) {
        const cell = row.insertCell();
        cell.contentEditable = "true";
        cell.textContent = [
          "Enter time",
          "Enter activity",
          "Enter description"
        ][i];
      }

      const action = row.insertCell();
      action.className = "actions";
      action.innerHTML =
        '<button class="delete" onclick="deleteRow(this)">Delete</button>';

      status.textContent = "New activity added.";
    }

    function deleteRow(button) {
      if (confirm("Delete this activity?")) {
        button.closest("tr").remove();
        saveSchedule();
      }
    }

    function saveSchedule() {
      const rows = [...body.rows].map(row => {
        return [...row.cells]
          .slice(0, 3)
          .map(cell => cell.innerText.trim());
      });

      try {
        localStorage.setItem(
          "activitySchedule",
          JSON.stringify(rows)
        );

        status.textContent =
          "Schedule saved in this browser!";
      } catch (error) {
        status.textContent =
          "Could not save. Please copy your schedule.";
      }
    }

    function loadSchedule() {
      try {
        const saved = localStorage.getItem("activitySchedule");
        if (!saved) return;

        const rows = JSON.parse(saved);
        body.innerHTML = "";

        rows.forEach(data => {
          const row = body.insertRow();

          data.forEach(value => {
            const cell = row.insertCell();
            cell.contentEditable = "true";
            cell.textContent = value;
          });

          const action = row.insertCell();
          action.className = "actions";
          action.innerHTML =
            '<button class="delete" onclick="deleteRow(this)">Delete</button>';
        });
      } catch (error) {
        status.textContent = "Unable to load saved schedule.";
      }
    }

    loadSchedule();
  </script>
</body>
</html>
