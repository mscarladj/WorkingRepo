<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophisticated Velvet Luxury Background</title>
    <style>
        /* Reset and structure */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', 'Didot', 'Playfair Display', 'Georgia', serif;
            color: #DAAA56; /* Muted vintage gold text color */
            
            /* 
               Luxury Background Layering:
               1. A subtle, soft radial gold glow highlighting the center.
               2. A rich burgundy-to-crimson linear gradient.
               3. A solid, deep charcoal/near-black base to ground the vibrant colors and add weight.
            */
            background: 
                radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.15) 0%, rgba(0, 0, 0, 0) 70%),
                linear-gradient(135deg, #780000 0%, #5A0004 40%, #0B0F14 100%);
            background-color: #0B0F14; /* Fallback dark grounding neutral */
            
            /* Vignette effect to mimic a heavy velvet lighting look */
            box-shadow: inset 0 0 100px rgba(11, 15, 20, 0.85);
            overflow-x: hidden;
        }

        /* Sample Content Container to display contrast */
        .card {
            background: rgba(11, 15, 20, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 3rem;
            border-radius: 4px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            background: linear-gradient(135deg, #D4AF37 0%, #DAAA56 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            letter-spacing: 1px;
            color: #e5e5e5;
        }

        .accent-line {
            width: 50px;
            height: 1px;
            background: #D4AF37;
            margin: 1.5rem auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Luxury Styling</h1>
        <div class="accent-line"></div>
        <p>A sophisticated blend of deep burgundy, vintage gold accents, and a grounding charcoal neutral creates a rich, velvet-like luxury aesthetic.</p>
    </div>

</body>
</html>
